name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Next.js build (production)
        run: npm run build
        env:
          # Dummy env vars so Auth/DB code doesn't crash at build time.
          # Real values live in Vercel project settings.
          NEXTAUTH_URL: https://salaamthailand.com
          NEXTAUTH_SECRET: ci-dummy-secret-not-used-at-runtime
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      - name: Sitemap check
        run: |
          if [ ! -f .next/server/app/sitemap.xml.body ] && [ ! -f out/sitemap.xml ]; then
            echo "::warning::Sitemap not generated — check app/sitemap.ts"
          fi
